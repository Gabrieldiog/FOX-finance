name: manter o banco acordado

# O Supabase no plano free PAUSA o projeto depois de 7 dias sem nenhuma conexão.
# Quando isso acontece o app inteiro cai: entrar, criar conta e qualquer tela que
# leia dado devolvem 500 — sem aviso nenhum. Foi exatamente o que aconteceu em
# agosto/2026.
#
# Este job toca o banco de 2 em 2 dias (o /api/health faz um `select 1` de
# verdade), o que basta pra o projeto nunca chegar nos 7 dias de ócio.
#
# Ele é também o alarme: o health responde 503 quando o Postgres não atende,
# então o job fica vermelho e o GitHub manda e-mail — em vez de você descobrir
# tentando criar uma conta.
#
# ATENÇÃO: o GitHub desliga sozinho os workflows agendados de repositório que
# passa 60 dias sem commit. Se o Fox ficar parado tanto tempo, reative na aba
# Actions (o botão "Run workflow" também serve de ping manual).

on:
  schedule:
    - cron: "0 12 */2 * *" # a cada 2 dias, meio-dia UTC (9h em São Paulo)
  workflow_dispatch: # botão "Run workflow", pra pingar na hora

permissions: {} # não precisa de acesso nenhum ao repositório

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o health check
        env:
          # Dá pra apontar pra outro domínio sem editar o arquivo: basta criar a
          # variable FOX_URL em Settings > Secrets and variables > Actions.
          BASE: ${{ vars.FOX_URL || 'https://fox-finance.vercel.app' }}
        run: |
          set -uo pipefail
          # 3 tentativas espaçadas: um blip de rede não vira alarme falso, e o
          # cold start da Vercel tem tempo de acordar.
          for tentativa in 1 2 3; do
            resposta=$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE/api/health" || true)
            corpo=$(printf '%s' "$resposta" | sed '$d')
            status=$(printf '%s' "$resposta" | tail -n1)
            echo "tentativa $tentativa -> HTTP ${status:-sem resposta} | ${corpo:-vazio}"
            if [ "$status" = "200" ]; then
              echo "Banco acordado."
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "::error::O Fox não respondeu 200 no health check em 3 tentativas. Confira se o projeto do Supabase foi pausado (dashboard > Resume project)."
          exit 1
